[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "declare4py"
description = "Python library to perform discovery, conformance checking and query checking of DECLARE constraints."
readme = "README.md"
requires-python = ">=3.9.7"
keywords = [
    "python", "bpm", "declare", "process-mining",
    "rule-mining", "business-process-management",
    "declarative-process-models"
]
#license = {text = "GPL"}
authors = [
    { name = "Ivan Donadello", email = "ivan.donadello@unibz.it" },
    { name = "Francesco Riva", email = "francesco.riva@unibz.it" },
    { name = "Fabrizio Maria Maggi", email = "maggi@inf.unibz.it" }
]
dependencies = [
    "pandas~=1.5.3",
    "numpy~=1.24.2",
    "scikit-learn~=1.2.2",
    "pm4py~=2.6.1",
    "logaut~=0.2.0",
    "pylogics~=0.2.0",
    "packaging~=23.0",
    "pyparsing<3",
    "mlxtend~=0.21.0 ",
    "pythomata~=0.3.2" ,
    "mlxtend~=0.21.0",
    "numba~=0.57.0",
    "matplotlib~=3.6.3",
    "clingo==5.6.2",
    "boolean.py==4.0",
    "ltlf2dfa==1.0.2",
    "graphviz~=0.20.3",
    "groq",
    "python-dotenv"
]
dynamic = ["version"]
